<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VyroTimes - Checkout</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://storage.perfectcdn.com/skyrh3/lr64rxl9h84mczjt.png">
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="checkout-app-iframe" src="https://script.google.com/macros/s/AKfycbw8NpzNrggY-tL_DAGac1q05nUTjpzKtIhUhm2NYX46OiohIjA7qn51ggNEaDleuHY2/exec" allow="payment"></iframe>

  <script>
    const iframe = document.getElementById("checkout-app-iframe");
    const urlParams = new URLSearchParams(window.location.search);
    const vyroUserId = urlParams.get("vyro_user_id") || "";
    const amount = urlParams.get("amount") || "";

    // Forward parameters directly via postMessage when iframe finishes loading
    iframe.onload = function() {
      iframe.contentWindow.postMessage({
        vyro_user_id: vyroUserId,
        amount: amount
      }, "*");
    };

    // Relay messages from parent SMM Panel window if received
    window.addEventListener("message", function(event) {
      if (event.data && (event.data.vyro_user_id || event.data.amount)) {
        iframe.contentWindow.postMessage(event.data, "*");
      }
    });
  </script>
</body>
</html>
